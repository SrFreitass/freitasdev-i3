
[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1"

[window]
dynamic_padding = true
decorations = "full"
title = "Alacritty@CachyOS"
opacity = 0.5
decorations_theme_variant = "Dark"

  [window.dimensions]
  columns = 100
  lines = 30

  [window.class]
  instance = "Alacritty"
  general = "Alacritty"

[scrolling]
history = 10_000
multiplier = 3

[colors]
draw_bold_text_with_bright_colors = true

  [colors.primary]
  foreground = "#e6edf3"
  background = "#010409"

  [colors.cursor]
  text = "#010409"
  cursor = "#e6edf3"

  [colors.selection]
  text = "#e6edf3"
  background = "#264f78"

  [colors.normal]
  black = "#484f58"
  red = "#ff7b72"
  green = "#3fb950"
  yellow = "#d29922"
  blue = "#58a6ff"
  magenta = "#bc8cff"
  cyan = "#39c5cf"
  white = "#b1bac4"

  [colors.bright]
  black = "#6e7681"
  red = "#ffa198"
  green = "#56d364"
  yellow = "#e3b341"
  blue = "#79c0ff"
  magenta = "#d2a8ff"
  cyan = "#56d4dd"
  white = "#ffffff"


[font]
size = 14

  [font.normal]
  family = "monospace"
  style = "Regular"

  [font.bold]
  family = "monospace"
  style = "Bold"

  [font.italic]
  family = "monospace"
  style = "Italic"

  [font.bold_italic]
  family = "monospace"
  style = "Bold Italic"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = "Block"
vi_mode_style = "None"
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true

  [[mouse.bindings]]
  mouse = "Middle"
  action = "PasteSelection"

[[keyboard.bindings]]
key = "Paste"
action = "Paste"

[[keyboard.bindings]]
key = "Copy"
action = "Copy"

[[keyboard.bindings]]
key = "L"
mods = "Control"
action = "ClearLogNotice"

[[keyboard.bindings]]
key = "L"
mods = "Control"
mode = "~Vi"
chars = "\f"

[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "Home"
mods = "Shift"
mode = "~Alt"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
mode = "~Alt"
action = "ScrollToBottom"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
key = "B"
mods = "Control|Shift"
action = "SearchBackward"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi"
action = "ClearSelection"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[general]
live_config_reload = true
working_directory = "None"
